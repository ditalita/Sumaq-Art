<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frankies | Sumaq Art</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .frankies-page {
      padding: 60px 8%;
      text-align: center;
    }

    .frankies-page h2 {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .plushie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 30px;
      margin-top: 45px;
    }

    .plushie-card {
      background: #fff0f7;
      color: #402337;
      padding: 18px;
      border-radius: 20px;
    }

    .plushie-card img {
      width: 100%;
      height: 290px;
      object-fit: contain;
      border-radius: 12px;
    }

    .plushie-card h3 {
      font-size: 1.6rem;
      margin: 15px 0 8px;
    }

    .plushie-card p {
      line-height: 1.6;
    }
 /* Plaid background */
html, body {
  background: url("images/IMG_2591.jpeg") center center / cover fixed no-repeat !important;
}

/* Make the artwork area transparent */
main, section, .plushie-grid {
  background: transparent !important;
}

/* Make each artwork tile bigger */
.plushie-card {
  width: 90%;
  max-width: 1000px;
  margin: 30px auto;
  padding: 35px;
  background: rgba(255, 245, 250, 0.92);
  border-radius: 25px;
}

/* Make artwork images large */
.plushie-card img {
  display: block;
  max-width: 100%;
  max-height: 75vh;
  width: auto;
  margin: auto;
  object-fit: contain;
}
    /* One artwork per row */
.plushie-grid {
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  gap: 50px !important;
  padding: 40px 20px !important;
}

/* Large artwork tiles */
.plushie-card {
  box-sizing: border-box;
  width: 95% !important;
  max-width: 1100px !important;
  min-height: 85vh !important;
  margin: 0 auto !important;
  padding: 35px !important;

  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
  gap: 18px !important;

  background: rgba(255, 245, 250, 0.88) !important;
  border-radius: 30px !important;
}

/* Make the plushie pictures big */
.plushie-card img {
  display: block !important;
  width: auto !important;
  max-width: 100% !important;
  height: auto !important;
  max-height: 65vh !important;
  object-fit: contain !important;
  margin: 0 auto !important;
}

/* Artwork names */
.plushie-card h3 {
  font-size: 36px !important;
  margin: 5px 0 !important;
  color: #4b1768 !important;
}

/* Descriptions */
.plushie-card p {
  font-size: 18px !important;
  text-align: center !important;
  margin: 0 !important;
}

/* Smooth scrolling */
html {
  scroll-behavior: smooth;
}
  </style>
</head>

<body>
  <main class="frankies-page">
    <a href="index.html">← Back to Sumaq Art</a>

    <h2>Frankies</h2>
    <p>A collection of my handmade plushie creations.</p>

    <div class="plushie-grid">

      <div class="plushie-card">
<img src="images/aeaa2ed3-a7fe-4690-be69-ea189b31cbb6.png" alt="Miss the pink pig">
        <h3>Miss</h3>
        <p>Description coming soon.</p>
      </div>

      <div class="plushie-card">
<img src="images/c2eb6086-b00a-48c3-99d6-3607cc3dd69d.png" alt="Mushu the dog">
        <h3>Mushu</h3>
        <p>Description coming soon.</p>
      </div>

      <div class="plushie-card">
<img src="images/db096712-1322-47f4-a381-41cda8c825b4.png" alt="Frank the yellow pig">
        <h3>Frank</h3>
        <p>Description coming soon.</p>
      </div>

      <div class="plushie-card">
<img src="images/23c87bcc-8187-4263-ab12-80ccb0523b1d.png" alt="Pumpkin the bear">
        <h3>Pumpkin</h3>
        <p>Description coming soon.</p>
      </div>

      <div class="plushie-card">
<img src="images/46b0475f-5285-4de6-a5a8-667b58bfaec9.png" alt="Daisy the jaguar">
        <h3>Daisy</h3>
        <p>Description coming soon.</p>
      </div>

    </div>
  </main>
</body>
</html>
