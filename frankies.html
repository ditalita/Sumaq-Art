<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frankies | Sumaq Art</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .frankies-page {
      padding: 60px 8%;
      text-align: center;
    }

    .frankies-page h2 {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .plushie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 30px;
      margin-top: 45px;
    }

    .plushie-card {
      background: #fff0f7;
      color: #402337;
      padding: 18px;
      border-radius: 20px;
    }

    .plushie-card img {
      width: 100%;
      height: 290px;
      object-fit: contain;
      border-radius: 12px;
    }

    .plushie-card h3 {
      font-size: 1.6rem;
      margin: 15px 0 8px;
    }

    .plushie-card p {
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="frankies-page">
    <a href="index.html">← Back to Sumaq Art</a>

    <h2>Frankies</h2>
    <p>A collection of my handmade plushie creations.</p>

    <div class="plushie-grid">

      <div class="plushie-card">
        <img src="" alt="Miss the pig">
        <h3>Miss</h3>
        <p>Description coming soon.</p>
      </div>

      <div class="plushie-card">
        <img src="" alt="Mushu the dog">
        <h3>Mushu</h3>
        <p>Description coming soon.</p>
      </div>

      <div class="plushie-card">
        <img src="" alt="Frank the yellow pig">
        <h3>Frank</h3>
        <p>Description coming soon.</p>
      </div>

      <div class="plushie-card">
        <img src="" alt="Pumpkin the bear">
        <h3>Pumpkin</h3>
        <p>Description coming soon.</p>
      </div>

      <div class="plushie-card">
        <img src="" alt="Daisy the jaguar">
        <h3>Daisy</h3>
        <p>Description coming soon.</p>
      </div>

    </div>
  </main>
</body>
</html>
