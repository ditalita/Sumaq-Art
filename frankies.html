<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frankies | Sumaq Art</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y proximity;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #4b1768;
      background-image: url("images/IMG_2591.jpeg");
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    .frankies-page {
      text-align: center;
      padding: 30px 3%;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #4b1768;
      background: rgba(255,255,255,0.9);
      padding: 12px 22px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }

    .page-heading {
      background: rgba(255,245,250,0.9);
      border-radius: 25px;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto 30px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(40px, 6vw, 70px);
      margin: 5px 0;
    }

    .page-heading p {
      font-size: 18px;
    }

    /* One plushie per screen */
    .plushie-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      width: 100%;
    }

    /* Large artwork tile */
    .plushie-card {
      scroll-snap-align: start;
      width: 100%;
      max-width: 1250px;
      min-height: 90vh;
      padding: 30px;
      background: rgba(255,245,250,0.9);
      border-radius: 30px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    /* Large artwork image */
    .plushie-card img {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 15px;
    }

    .plushie-card h2 {
      font-family: Georgia, serif;
      font-size: clamp(32px, 4vw, 48px);
      margin: 10px 0 0;
    }

    .plushie-card p {
      font-size: 19px;
      line-height: 1.6;
      max-width: 650px;
      margin: 0;
    }

    @media (max-width: 600px) {
      .frankies-page {
        padding: 15px;
      }

      .plushie-card {
        padding: 20px;
        min-height: 85vh;
      }

      .plushie-card img {
        max-height: 58vh;
      }
    }
  </style>
</head>

<body>
  <main class="frankies-page">

    <a href="index.html" class="back-link">
      ← Back to Sumaq Art
    </a>

    <div class="page-heading">
      <h1>Frankies</h1>
      <p>A collection of my handmade plushie creations.</p>
    </div>

    <div class="plushie-grid">

      <article class="plushie-card">
        <img src="images/aeaa2ed3-a7fe-4690-be69-ea189b31cbb6.png" alt="Miss the pink pig">
        <h2>Miss</h2>
        <p>Description coming soon.</p>
      </article>

      <article class="plushie-card">
        <img src="images/c2eb6086-b00a-48c3-99d6-3607cc3dd69d.png" alt="Mushu the dog">
        <h2>Mushu</h2>
        <p>Description coming soon.</p>
      </article>

      <article class="plushie-card">
        <img src="images/db096712-1322-47f4-a381-41cda8c825b4.png" alt="Frank the pig">
        <h2>Frank</h2>
        <p>Description coming soon.</p>
      </article>

      <article class="plushie-card">
        <img src="images/23c87bcc-8187-4263-ab12-80ccb0523b1d.png" alt="Pumpkin the bear">
        <h2>Pumpkin</h2>
        <p>Description coming soon.</p>
      </article>

      <article class="plushie-card">
        <img src="images/46b0475f-5285-4de6-a5a8-667b58bfaec9.png" alt="Daisy the jaguar">
        <h2>Daisy</h2>
        <p>Description coming soon.</p>
      </article>

    </div>
  </main>
</body>
</html>
